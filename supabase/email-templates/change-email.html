<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="x-apple-disable-message-reformatting">
  <meta name="format-detection" content="telephone=no,date=no,address=no,email=no">
  <style>a[x-apple-data-detectors],.nolink a{color:inherit!important;text-decoration:none!important;font-size:inherit!important;font-family:inherit!important;font-weight:inherit!important;line-height:inherit!important;}u+#body a{color:inherit;text-decoration:none;}</style>
  <meta name="color-scheme" content="light">
  <meta name="supported-color-schemes" content="light">
  <title>Confirm your new email for G&amp;R</title>
</head>
<body id="body" style="margin:0;padding:0;background-color:#F6F2EC;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#F6F2EC;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;background-color:#FFFFFF;border-radius:20px;">
          <tr>
            <td align="center" style="padding:30px 28px 6px 28px;">
              <img src="https://gr-staff-portal.vercel.app/logo-mark.png" width="120" alt="G&amp;R" style="display:block;width:120px;max-width:120px;height:auto;border:0;outline:none;text-decoration:none;">
              <div style="padding-top:6px;font-family:Helvetica,Arial,sans-serif;font-size:13px;line-height:16px;letter-spacing:3px;color:#4A433C;">à votre service</div>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:16px 28px 8px 28px;font-family:'Fraunces',Georgia,'Times New Roman',serif;font-size:26px;line-height:32px;font-weight:normal;color:#1A1714;">Confirm your new email</td>
          </tr>
          <tr>
            <td align="center" style="padding:0 28px 18px 28px;font-family:Helvetica,Arial,sans-serif;font-size:15px;line-height:22px;color:#4A433C;">Tap the button to sign in to G&amp;R with <b style="color:#1A1714;">{{ .NewEmail }}</b> from now on.</td>
          </tr>
          <tr>
            <td align="center" style="padding:0 28px 22px 28px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td align="center" bgcolor="#2E7D5B" style="border-radius:12px;background-color:#2E7D5B;">
                    <a href="{{ .ConfirmationURL }}" target="_blank" style="display:block;padding:15px 20px;font-family:Helvetica,Arial,sans-serif;font-size:16px;line-height:20px;font-weight:bold;color:#FFFFFF;text-decoration:none;border-radius:12px;">Confirm</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:0 28px 28px 28px;font-family:Helvetica,Arial,sans-serif;font-size:12px;line-height:18px;color:#9A9187;">Didn&#39;t ask for this? You can ignore this email.</td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
